name: Build Linux AppImage

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add X2Go official PPA and install dependencies
        run: |
          sudo add-apt-repository -y ppa:x2go/stable
          sudo apt-get update
          sudo apt-get install -y x2goclient nxproxy libxcomp3 \
            libqt5core5a libqt5gui5 libqt5widgets5 libqt5network5 libqt5svg5 \
            wget file patchelf desktop-file-utils

      - name: Download linuxdeploy and plugins
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/128x128/apps
          
          # Copy x2goclient and nxproxy binaries
          cp $(which x2goclient) AppDir/usr/bin/
          cp $(which nxproxy) AppDir/usr/bin/
          
          # Copy desktop and icon
          if [ -f /usr/share/applications/x2goclient.desktop ]; then
            cp /usr/share/applications/x2goclient.desktop AppDir/usr/share/applications/
          fi
          if [ -f /usr/share/icons/hicolor/128x128/apps/x2goclient.png ]; then
            cp /usr/share/icons/hicolor/128x128/apps/x2goclient.png AppDir/usr/share/icons/hicolor/128x128/apps/
          fi

      - name: Bundle AppImage
        env:
          QMAKE: /usr/lib/qt5/bin/qmake
        run: |
          ./linuxdeploy --appdir AppDir \
            -e /usr/bin/x2goclient \
            -e /usr/bin/nxproxy \
            -d /usr/share/applications/x2goclient.desktop \
            -i /usr/share/icons/hicolor/128x128/apps/x2goclient.png \
            --plugin qt \
            --output appimage
          
          # Rename output to clean name
          mv X2Go_Client*.AppImage x2goclient-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: x2goclient-x86_64.AppImage
          path: x2goclient-x86_64.AppImage

      - name: Release AppImage on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: x2goclient-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
